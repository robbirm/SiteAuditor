plugins {
    id 'com.android.application'
}

android {
    namespace 'com.robgames.snailchess'
    compileSdk 34

    defaultConfig {
        applicationId "com.robgames.snailchess"   // change before publishing if you like
        minSdk 26
        targetSdk 34
        // GitHub builds number themselves so every new APK installs as an update
        versionCode = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName = "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // A fixed key, so every build can update the app already on your phone.
    // (For Google Play, create your own private release key instead — see README.)
    // If the key file is missing the build still works (it just uses Android's default debug key).
    def sharedKey = file('snailchess.keystore')
    signingConfigs {
        shared {
            storeFile file('snailchess.keystore')
            storePassword 'snailchess'
            keyAlias 'snailchess'
            keyPassword 'snailchess'
        }
    }

    buildTypes {
        debug {
            if (sharedKey.exists()) signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
