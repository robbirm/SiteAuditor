<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modernise Site Auditor</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--panel2:#f8fafd;--line:#e6e9f0;--text:#0b1220;--mut:#667085;--blue:#2563eb;--blue2:#3b82f6;--blue-s:#eef3ff;--red:#dc2626;--red-s:#fef2f2;--amb:#b45309;--amb-s:#fffbeb;--grn:#15803d;--grn-s:#f0fdf4;--hover:#f1f4f9;--glow:rgba(37,99,235,.10);--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);--sh2:0 10px 30px -10px rgba(16,24,40,.18),0 4px 10px -6px rgba(16,24,40,.08);--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080a10;--panel:#11141c;--panel2:#0e1118;--line:#212736;--text:#e8ecf3;--mut:#8b95a7;--blue:#5b8cff;--blue2:#7aa2ff;--blue-s:#16213d;--red:#f87171;--red-s:#2a1517;--amb:#fbbf24;--amb-s:#2a2210;--grn:#4ade80;--grn-s:#10231a;--hover:#1a1f2b;--glow:rgba(91,140,255,.13);--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 14px 34px -12px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080a10;--panel:#11141c;--panel2:#0e1118;--line:#212736;--text:#e8ecf3;--mut:#8b95a7;--blue:#5b8cff;--blue2:#7aa2ff;--blue-s:#16213d;--red:#f87171;--red-s:#2a1517;--amb:#fbbf24;--amb-s:#2a2210;--grn:#4ade80;--grn-s:#10231a;--hover:#1a1f2b;--glow:rgba(91,140,255,.13);--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 14px 34px -12px rgba(0,0,0,.7);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 420px at 88% -8%,var(--glow),transparent 62%),radial-gradient(700px 360px at -5% 105%,var(--glow),transparent 60%),var(--bg);background-attachment:fixed;transition:background-color .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
.side,.card,.tw,.modal,.btn,.q,.chip,.nav,.b{transition:background-color .25s,border-color .25s,color .25s,box-shadow .25s,transform .25s var(--ease)}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}70%{box-shadow:0 0 0 7px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}

.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;animation:slideIn .5s var(--ease) both}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;font-weight:650;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#2563eb 55%,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;box-shadow:0 6px 16px -4px rgba(37,99,235,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .4s var(--ease)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
.brand small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.nav{position:relative;display:flex;align-items:center;gap:11px;padding:8px 10px;border:0;background:none;border-radius:10px;color:var(--mut);cursor:pointer;text-align:left;width:100%;font-weight:500}
.nav>span:first-child{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--hover);font-size:13px;transition:background-color .25s,color .25s,transform .3s var(--ease)}
.nav:hover{background:var(--hover);color:var(--text);transform:translateX(2px)}
.nav:hover>span:first-child{transform:scale(1.08)}
.nav.on{background:var(--blue-s);color:var(--blue);font-weight:600}
.nav.on>span:first-child{background:var(--blue);color:#fff;box-shadow:0 4px 10px -3px rgba(37,99,235,.6)}
.nav.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.nav .n{margin-left:auto;font-size:11px;background:var(--hover);color:var(--mut);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.nav.on .n{background:var(--panel);color:var(--blue)}
.sp{flex:1}
.main{flex:1;min-width:0;padding:28px 32px 48px;max-width:1320px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;animation:rise .5s var(--ease) both}
h1{font-size:27px;letter-spacing:-.035em;margin:0;font-weight:700}h2{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.mut{color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;animation:pulse 1.6s infinite}
.banner{background:var(--amb-s);color:var(--amb);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;animation:rise .4s var(--ease) both}
.banner.err{background:var(--red-s);color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.audit{display:flex;gap:10px;flex-wrap:wrap;padding:16px;animation:rise .55s var(--ease) both;animation-delay:.05s}
.audit input{flex:1;min-width:200px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);outline:none;font-size:14.5px}
.audit input.lim{flex:none;width:112px;min-width:0}
.audit input:focus,.q:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-s);background:var(--panel)}
.btn{position:relative;overflow:hidden;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:550;box-shadow:var(--sh)}
.btn:hover{background:var(--hover);transform:translateY(-1px);box-shadow:var(--sh2)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.p{background:linear-gradient(180deg,var(--blue2),var(--blue));border-color:transparent;color:#fff;padding:12px 24px;font-weight:600;box-shadow:0 8px 20px -8px rgba(37,99,235,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.p::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn.p:hover{background:linear-gradient(180deg,var(--blue2),var(--blue));filter:brightness(1.05)}
.btn.p:hover::after{transform:translateX(120%)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
a.btn{text-decoration:none;color:inherit;display:inline-block}a.btn.p{color:#fff}
.bar{height:8px;background:var(--hover);border-radius:9px;overflow:hidden;margin-top:6px;width:100%}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue2),var(--blue));transition:width .6s var(--ease);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px;margin:18px 0}
.cards>*{animation:rise .55s var(--ease) both}
.cards>:nth-child(1){animation-delay:.08s}.cards>:nth-child(2){animation-delay:.14s}.cards>:nth-child(3){animation-delay:.2s}.cards>:nth-child(4){animation-delay:.26s}.cards>:nth-child(5){animation-delay:.32s}
.stat{position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent,var(--blue));opacity:.85}
.statTop{display:flex;justify-content:space-between;align-items:center}
.ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent,var(--blue));background:color-mix(in srgb,var(--accent,var(--blue)) 12%,transparent)}
.stat .l{color:var(--mut);font-size:12.5px;font-weight:550}.stat .v{font-size:31px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.cards .card:hover,.ex .card:hover,.grid3 .card:hover,.grid2 .card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--blue) 28%,var(--line))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
.view>*{animation:rise .55s var(--ease) both}
.view>:nth-child(2){animation-delay:.06s}.view>:nth-child(3){animation-delay:.12s}.view>:nth-child(4){animation-delay:.18s}.view>:nth-child(n+5){animation-delay:.24s}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;border-radius:10px;transition:background-color .2s,transform .25s var(--ease),padding .25s var(--ease)}
.row[style*="cursor"]:hover{background:var(--hover);padding:4px 8px;margin-left:-8px;margin-right:-8px}
.row .t{flex:1;min-width:0}.row .bar{margin:0;flex:1.2}
.ring{flex:none}.ring circle.v{transition:stroke-dashoffset 1.2s var(--ease),stroke .4s}.ring .rt{font:700 27px Inter,ui-sans-serif,system-ui,sans-serif;fill:var(--text)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.q{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);outline:none}
.q.sel{flex:none;min-width:0;width:auto;max-width:100%}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-size:13px;font-weight:500}
.chip:hover{color:var(--text);transform:translateY(-1px);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.chip.on{background:var(--blue-s);color:var(--blue);border-color:var(--blue);font-weight:600}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr{animation:fade .4s var(--ease) both;transition:background-color .15s}
tbody tr:hover{background:var(--hover)}tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
.b{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;opacity:.85}
.b.error{background:var(--red-s);color:var(--red)}.b.warning{background:var(--amb-s);color:var(--amb)}.b.ok{background:var(--grn-s);color:var(--grn)}.b.notice{background:var(--blue-s);color:var(--blue)}
.empty{padding:44px 20px;text-align:center;color:var(--mut)}
.eico{width:54px;height:54px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;font-size:24px;color:var(--blue);background:var(--blue-s);animation:pulse 2.4s infinite}
.skwrap{padding:18px;display:grid;gap:16px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--hover) 25%,var(--line) 37%,var(--hover) 63%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.ex>*{animation:rise .55s var(--ease) both}.ex>:nth-child(2){animation-delay:.06s}.ex>:nth-child(3){animation-delay:.12s}.ex>:nth-child(4){animation-delay:.18s}.ex>:nth-child(5){animation-delay:.24s}
.ex .card{display:flex;flex-direction:column;gap:9px}.ex p{margin:0;flex:1}
.mask{position:fixed;inset:0;background:rgba(5,8,20,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:9;animation:fade .2s both}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(740px,100%);max-height:86vh;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .35s var(--ease) both}
.kvr{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.kk{width:130px;flex:none;color:var(--mut);font-size:12px}.kvv{min-width:0;word-break:break-word;flex:1}
.fld{display:grid;gap:5px;margin-bottom:12px}.fld>label,.fld>.lb{font-size:12px;color:var(--mut);font-weight:550}
.fld input[type=text]{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);outline:none;width:100%}
.fld input[type=text]:focus,.q:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;background:var(--panel2);min-height:84px}
.drop:hover{border-color:var(--blue)}
.prev{width:150px;height:56px;border-radius:10px;background:repeating-conic-gradient(var(--hover) 0 25%,var(--panel) 0 50%) 0 0/14px 14px;display:grid;place-items:center;flex:none;overflow:hidden;border:1px solid var(--line)}
.prev img{max-width:100%;max-height:100%;display:block}
.seg{display:flex;gap:6px}.acc{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.pg{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:46px}
.pg.l{justify-content:flex-start}.pg.c{justify-content:center}.pg.r{justify-content:flex-end}
.pg img{max-height:26px;max-width:150px}.pg span{color:#667085;font-size:11px}
@media (max-width:820px){.fgrid{grid-template-columns:1fr}.drop{flex-direction:column;align-items:flex-start}}
summary{cursor:pointer;color:var(--blue);font-weight:550;margin-top:10px}
@media (max-width:820px){
.app{flex-direction:column}
.side{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;border-right:0;border-bottom:1px solid var(--line);align-items:center;animation:none}
.brand{padding:0 8px 0 4px}.brand small,.nav .n,.sp{display:none}.nav{width:auto;white-space:nowrap}.nav.on::before{display:none}.nav:hover{transform:none}
.main{padding:18px 14px 36px}.grid2{grid-template-columns:1fr}.stat .v{font-size:25px}h1{font-size:23px}.kvr{flex-direction:column;gap:2px}.modal{border-radius:18px 18px 0 0;align-self:end}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect}=React;
const h=React.createElement;
const d=(c,...k)=>{const p={className:c};if(k[0]&&typeof k[0]==='object'&&!k[0].$$typeof&&!Array.isArray(k[0]))Object.assign(p,k.shift());return h('div',p,...k)};

/* ---------- helpers ---------- */
const SC={critical:'error',warning:'warning',info:'notice',ok:'ok'},SL={critical:'Critical',warning:'Warning',info:'Info',ok:'OK'};
const PAGE=50,ACTIVE=['queued','running','cancelling'];
const STATUS_LABEL={queued:'Queued',running:'Crawling',cancelling:'Cancelling',done:'Completed',cancelled:'Cancelled (partial results)',error:'Failed'};
const sevB=s=>h('span',{className:'b '+SC[s]},SL[s]||s);
const short=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const num=n=>n==null?'—':Number(n).toLocaleString();
const mono=u=>h('span',{className:'url'},u);
const dim=t=>h('span',{className:'mut'},t||'—');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const statusB=p=>p.blocked?h('span',{className:'b notice'},'Blocked'):p.failed?h('span',{className:'b error'},'Failed'):h('span',{className:'b '+(p.status>=400?'error':p.status>=300?'notice':'ok')},p.status);
const linkB=l=>h('span',{className:'b '+(l.broken?'error':l.redirect?'notice':l.status?'ok':'notice')},l.statusText);
const altB=i=>h('span',{className:'b '+({Missing:'warning',Empty:'notice',Present:'ok'})[i.altStatus]},i.altStatus);

async function api(path,opts){
  let res;
  try{res=await fetch(path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts&&opts.headers)}})}
  catch(e){throw new Error('Cannot reach the backend. Is the Node.js server running?')}
  let data=null;try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error((data&&data.error)||('Request failed ('+res.status+')'));
  return data;
}
function useDebounced(v,ms){const [x,setX]=useState(v);useEffect(()=>{const t=setTimeout(()=>setX(v),ms);return()=>clearTimeout(t)},[v,ms]);return x}
function useList(section,crawlId,params,tick){
  const [s,setS]=useState({rows:[],total:0,loading:false,err:''});
  const key=JSON.stringify(params);
  useEffect(()=>{
    if(!crawlId){setS({rows:[],total:0,loading:false,err:''});return}
    let dead=false;setS(x=>({...x,loading:true}));
    api('/api/crawls/'+crawlId+'/'+section+'?'+new URLSearchParams(params))
      .then(r=>{if(!dead)setS({rows:r.rows,total:r.total,loading:false,err:''})})
      .catch(e=>{if(!dead)setS(x=>({...x,loading:false,err:e.message}))});
    return()=>{dead=true};
  },[crawlId,section,key,tick]);
  return s;
}

/* ---------- motion components ---------- */
function AnimNum({value,suffix}){ // counts up smoothly to the value
  const [v,setV]=useState(0);
  useEffect(()=>{
    if(typeof value!=='number')return;
    const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce||v===value){setV(value);return}
    let raf,start=null;const from=v;
    const step=t=>{if(start==null)start=t;const k=Math.min(1,(t-start)/650),e=1-Math.pow(1-k,3);setV(Math.round(from+(value-from)*e));if(k<1)raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf);
  },[value]);
  return typeof value==='number'?num(v)+(suffix||''):'—';
}
function Ring({value}){ // animated health-score gauge
  const [on,setOn]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setOn(true),80);return()=>clearTimeout(t)},[]);
  const R=40,C=2*Math.PI*R,pct=value==null?0:Math.max(0,Math.min(100,value));
  const col=value==null?'var(--line)':value>=80?'var(--grn)':value>=60?'var(--amb)':'var(--red)';
  return h('svg',{className:'ring',viewBox:'0 0 100 100',width:108,height:108},
    h('circle',{cx:50,cy:50,r:R,fill:'none',stroke:'var(--hover)',strokeWidth:9}),
    h('circle',{className:'v',cx:50,cy:50,r:R,fill:'none',stroke:col,strokeWidth:9,strokeLinecap:'round',strokeDasharray:C,strokeDashoffset:on?C*(1-pct/100):C,transform:'rotate(-90 50 50)'}),
    h('text',{x:50,y:57,textAnchor:'middle',className:'rt'},value==null?'—':value));
}
const Skel=()=>d('tw',d('skwrap',...Array.from({length:7},(_,i)=>d('skel',{key:i,style:{width:(55+((i*19)%40))+'%'}}))));
const Empty=t=>d('card empty',h('div',{className:'eico'},'◎'),t);

/* ---------- shared components ---------- */
function Tbl({cols,rows,onRow,sort,setSort}){
  if(!rows.length)return d('tw',d('empty','No results.'));

      view==='images'&&h(ListPage,{...common,key:vk,section:'images',ph:'Search image URL, page or ALT text…',cols:IMAGE_COLS,onRow:null,
        btns:[h(ExportBtn,{key:'e',crawlId,file:'images',label:'Export Images CSV'})],
        filters:[{name:'filter',type:'chips',opts:[['all','All'],['missing','Missing ALT'],['empty','Empty ALT'],['present','Has ALT'],['oversized','Over 250 KB'],['broken','Broken']]}]}),
      view==='exports'&&h(Exports,{crawlId,s,canReport,onReport:()=>setShowRep(true)}))),
    detail?h(Detail,{p:detail,onClose:()=>setDetail(null)}):null,
    showRep?h(ReportModal,{crawlId,partial:status==='cancelled'||status==='error',onClose:()=>setShowRep(false)}):null);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
