<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modernise Site Auditor</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e6e8ec;--text:#0f172a;--mut:#64748b;--blue:#2563eb;--blue-s:#eff4ff;--red:#dc2626;--red-s:#fef2f2;--amb:#b45309;--amb-s:#fffbeb;--grn:#15803d;--grn-s:#f0fdf4;--hover:#f1f5f9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--panel:#12151c;--line:#232834;--text:#e8ecf3;--mut:#8b95a7;--blue:#5b8cff;--blue-s:#16213d;--red:#f87171;--red-s:#2a1517;--amb:#fbbf24;--amb-s:#2a2210;--grn:#4ade80;--grn-s:#10231a;--hover:#1a1f2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d12;--panel:#12151c;--line:#232834;--text:#e8ecf3;--mut:#8b95a7;--blue:#5b8cff;--blue-s:#16213d;--red:#f87171;--red-s:#2a1517;--amb:#fbbf24;--amb-s:#2a2210;--grn:#4ade80;--grn-s:#10231a;--hover:#1a1f2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:650;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.brand small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--mut);cursor:pointer;text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--hover);color:var(--text)}.nav.on{background:var(--blue-s);color:var(--blue)}
.nav .n{margin-left:auto;font-size:11px;background:var(--hover);color:var(--mut);border-radius:99px;padding:0 7px}
.sp{flex:1}
.main{flex:1;min-width:0;padding:24px 28px 40px;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:22px;letter-spacing:-.02em;margin:0}h2{font-size:15px;margin:0}
.mut{color:var(--mut)}
.banner{background:var(--amb-s);color:var(--amb);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.audit{display:flex;gap:10px;flex-wrap:wrap;padding:14px}
.audit input{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg);outline:none}
.audit input:focus,.q:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:550}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;padding:11px 22px;font-weight:600;box-shadow:0 1px 2px rgba(37,99,235,.35)}
.btn.p:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:default}
.bar{height:6px;background:var(--hover);border-radius:9px;overflow:hidden;margin-top:10px;width:100%}.bar i{display:block;height:100%;background:var(--blue);transition:width .15s}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.stat .l{color:var(--mut);font-size:12px;font-weight:500}.stat .v{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}.row .t{flex:1;min-width:0}.row .bar{margin:0;flex:1.2}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.q{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);outline:none}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-size:13px}
.chip.on{background:var(--blue-s);color:var(--blue);border-color:var(--blue)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:550;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--hover)}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:550;white-space:nowrap}
.b.error{background:var(--red-s);color:var(--red)}.b.warning{background:var(--amb-s);color:var(--amb)}.b.ok{background:var(--grn-s);color:var(--grn)}.b.notice{background:var(--blue-s);color:var(--blue)}
.empty{padding:36px;text-align:center;color:var(--mut)}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ex .card{display:flex;flex-direction:column;gap:8px}.ex p{margin:0;flex:1}
.mask{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;padding:16px;z-index:9}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(720px,100%);max-height:85vh;display:flex;flex-direction:column;gap:10px}
.modal textarea{flex:1;min-height:220px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px;font:12px ui-monospace,Menlo,monospace;resize:vertical}
@media (max-width:820px){
.app{flex-direction:column}
.side{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;border-right:0;border-bottom:1px solid var(--line);align-items:center}
.brand{padding:0 8px 0 4px}.brand small,.nav .n,.sp{display:none}.nav{width:auto;white-space:nowrap}
.main{padding:16px 14px 32px}.grid2{grid-template-columns:1fr}.stat .v{font-size:24px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useMemo,useEffect,useRef}=React;
const h=React.createElement;
const d=(c,...k)=>{const p={className:c};if(k[0]&&typeof k[0]==='object'&&!k[0].$$typeof&&!Array.isArray(k[0]))Object.assign(p,k.shift());return h('div',p,...k)};

/* ---------- SAMPLE DATA (demo only – no real crawl) ---------- */
// [path,status,titleLen,hasMeta,h1Count,words,responseMs]
const P=[['/',200,52,1,1,820,640],['/about',200,48,1,1,610,720],['/services',200,61,1,1,950,810],['/services/web-design',200,44,1,1,720,900],['/services/seo',200,38,0,1,540,1100],['/services/hosting',200,72,1,2,430,1250],['/services/branding',200,0,0,1,380,980],['/pricing',200,41,1,1,360,690],['/blog',200,35,1,1,280,760],['/blog/seo-checklist-2026',200,66,1,1,1850,1420],['/blog/core-web-vitals',200,58,1,1,1620,2650],['/blog/local-seo-guide',200,49,0,1,1240,1330],['/blog/website-speed-tips',200,63,1,1,1480,3100],['/blog/old-launch-post',404,0,0,0,0,210],['/contact',200,32,1,1,150,540],['/case-studies',200,45,1,1,520,880],['/case-studies/plumber-leads',200,57,1,1,880,970],['/case-studies/restaurant-bookings',200,53,0,3,760,1040],['/privacy',200,28,1,1,1900,450],['/terms',200,24,1,1,2100,430],['/old-services',301,0,0,0,0,180],['/team',200,22,0,1,240,810],['/careers',404,0,0,0,0,190],['/api/status',500,0,0,0,0,3400],['/faq',200,36,1,1,690,620],['/testimonials',200,40,1,1,310,1710],['/blog/page/2',200,34,0,1,420,890],['/landing/free-audit',200,59,1,1,470,1020]];
const L=[['/blog','/blog/old-launch-post','Our launch story',404,'Internal'],['/about','/careers','Join the team',404,'Internal'],['/','/old-services','Services',301,'Internal'],['/services','/old-services','Everything we do',301,'Internal'],['/team','https://twitter.com/old_handle_sample','Follow us',404,'External'],['/blog/local-seo-guide','https://example.org/seo-study-2019','Study',404,'External'],['/','/services/seo','SEO',200,'Internal'],['/pricing','/contact','Get a quote',200,'Internal'],['/about','https://linkedin.com/company/sample','LinkedIn',200,'External'],['/blog','/blog/seo-checklist-2026','SEO checklist',200,'Internal'],['/api/status','/api/health','Health',500,'Internal']];
const I=[['/','/img/hero.jpg','Modern website on a laptop',212],['/about','/img/team.jpg','',340],['/services/web-design','/img/portfolio-1.png','',480],['/services/seo','/img/chart.png','Search traffic chart',64],['/blog/core-web-vitals','/img/cwv.png','',910],['/blog/website-speed-tips','/img/speed.jpg','Stopwatch',1250],['/case-studies/plumber-leads','/img/plumber.jpg','Plumber at work',180],['/pricing','/img/tick.svg','Included',3],['/team','/img/staff-1.jpg','',95],['/contact','/img/map.png','Office location map',140]];

function issuesOf(r){
 const [,s,t,m,h1,w,ms]=r,o=[],a=(sev,msg)=>o.push({sev,msg});
 if(s>=500)a('error','Server error (5xx)');else if(s===404)a('error','Page not found (404)');else if(s===301)a('notice','Redirect (301)');
 if(s===200){
  if(!t)a('error','Missing title tag');else if(t>60)a('warning','Title too long (>60 chars)');else if(t<30)a('warning','Title too short (<30 chars)');
  if(!m)a('warning','Missing meta description');
  if(!h1)a('error','Missing H1');else if(h1>1)a('warning','Multiple H1 tags');
  if(w<300)a('warning','Thin content (<300 words)');
  if(ms>2500)a('warning','Slow response (>2.5s)');
 }
 return o;
}
const build=dom=>P.map(r=>{const is=issuesOf(r);return{url:'https://'+dom+r[0],path:r[0],status:r[1],title:r[2],meta:r[3]?'Yes':'No',h1:r[4],words:r[5],ms:r[6],issues:is,sev:is.some(i=>i.sev==='error')?'error':is.some(i=>i.sev==='warning')?'warning':is.length?'notice':'ok'}});

const csvOf=(cols,rows)=>[cols.map(c=>c[0]).join(',')].concat(rows.map(r=>cols.map(c=>{const v=String(c[1](r)??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(','))).join('\n');
const sevB=s=>h('span',{className:'b '+s},s==='ok'?'OK':s[0].toUpperCase()+s.slice(1));
const stB=s=>h('span',{className:'b '+(s>=500||s>=400?'error':s>=300?'notice':'ok')},s);
const Empty=()=>d('empty','No results match your filters.');

function Chips({opts,val,set}){return d('tools',...opts.map(([k,l])=>h('button',{key:k,className:'chip'+(val===k?' on':''),onClick:()=>set(k)},l)))}
function Tbl({cols,rows}){
 return d('tw',rows.length?h('table',null,h('thead',null,h('tr',null,...cols.map((c,i)=>h('th',{key:i,className:c.sort?'s':'',onClick:c.sort}, c.l)))),h('tbody',null,...rows.map((r,i)=>h('tr',{key:i},...cols.map((c,j)=>h('td',{key:j},c.r(r))))))):h(Empty));
}
function Toolbar({q,setQ,ph,children}){return d('tools',h('input',{className:'q',placeholder:ph,value:q,onChange:e=>setQ(e.target.value)}),children)}

/* ---------- VIEWS ---------- */
function Dashboard({pages,issues,links,score,go}){
 const groups={};issues.forEach(i=>{groups[i.msg]=(groups[i.msg]||{n:0,sev:i.sev});groups[i.msg].n++});
 const top=Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).slice(0,7),max=top.length?top[0][1].n:1;
 const worst=pages.filter(p=>p.sev==='error').slice(0,6);
 return h(React.Fragment,null,
  d('grid2',
   d('card',h('h2',null,'Top issues'),...top.map(([m,v])=>d('row',{key:m},d('t',m),d('bar',h('i',{style:{width:(v.n/max*100)+'%',background:v.sev==='error'?'var(--red)':v.sev==='warning'?'var(--amb)':'var(--blue)'}})),h('b',{style:{width:24,textAlign:'right'}},v.n)))),
   d('card',h('h2',null,'Pages needing attention'),...worst.map(p=>d('row',{key:p.url},h('span',{className:'url t'},p.path),stB(p.status))),h('button',{className:'btn',style:{marginTop:8},onClick:()=>go('pages')},'View all pages →'))),
  d('card',h('h2',null,'Health breakdown'),d('row',d('t','Healthy pages'),h('b',null,pages.filter(p=>p.sev==='ok').length),h('span',{className:'b ok'},'OK')),d('row',d('t','Pages with warnings'),h('b',null,pages.filter(p=>p.sev==='warning').length),h('span',{className:'b warning'},'Warning')),d('row',d('t','Pages with errors'),h('b',null,pages.filter(p=>p.sev==='error').length),h('span',{className:'b error'},'Error'))));
}
function Pages({pages,exp}){
 const [q,setQ]=useState(''),[f,setF]=useState('all'),[s,setS]=useState({k:'path',d:1});
 const rows=useMemo(()=>{
  let r=pages.filter(p=>(!q||(p.url+p.title).toLowerCase().includes(q.toLowerCase()))&&(f==='all'||(f==='issues'?p.issues.length>0:Math.floor(p.status/100)===+f[0])));
  return r.slice().sort((a,b)=>(a[s.k]>b[s.k]?1:a[s.k]<b[s.k]?-1:0)*s.d)},[pages,q,f,s]);
 const so=k=>()=>setS(x=>({k,d:x.k===k?-x.d:1})),ar=k=>s.k===k?(s.d>0?' ↑':' ↓'):'';
 return h(React.Fragment,null,
  h(Toolbar,{q,setQ,ph:'Search URLs or titles…'},h('button',{className:'btn',onClick:()=>exp('pages')},'Export CSV')),
  h(Chips,{opts:[['all','All'],['2xx','2xx OK'],['3xx','3xx Redirect'],['4xx','4xx Client error'],['5xx','5xx Server error'],['issues','With issues']],val:f,set:setF}),
  h('div',{className:'mut',style:{marginBottom:8}},rows.length+' of '+pages.length+' URLs'),
  h(Tbl,{rows,cols:[{l:'URL'+ar('path'),sort:so('path'),r:p=>h('span',{className:'url'},p.url)},{l:'Status'+ar('status'),sort:so('status'),r:p=>stB(p.status)},{l:'Title len'+ar('title'),sort:so('title'),r:p=>p.title||'—'},{l:'Meta',r:p=>p.meta},{l:'H1',r:p=>p.h1},{l:'Words'+ar('words'),sort:so('words'),r:p=>p.words||'—'},{l:'Response'+ar('ms'),sort:so('ms'),r:p=>p.ms+' ms'},{l:'Severity',r:p=>sevB(p.sev)}]}));
}
function Issues({issues,exp}){
 const [q,setQ]=useState(''),[f,setF]=useState('all');
 const rows=issues.filter(i=>(f==='all'||i.sev===f)&&(!q||(i.url+i.msg).toLowerCase().includes(q.toLowerCase())));
 return h(React.Fragment,null,h(Toolbar,{q,setQ,ph:'Search issues or URLs…'},h('button',{className:'btn',onClick:()=>exp('issues')},'Export CSV')),
  h(Chips,{opts:[['all','All'],['error','Errors'],['warning','Warnings'],['notice','Notices']],val:f,set:setF}),
  h(Tbl,{rows,cols:[{l:'Severity',r:i=>sevB(i.sev)},{l:'Issue',r:i=>i.msg},{l:'URL',r:i=>h('span',{className:'url'},i.url)}]}));
}
function Links({links,exp}){
 const [q,setQ]=useState(''),[f,setF]=useState('all');
 const rows=links.filter(l=>(f==='all'||(f==='broken'?l.status>=400:f==='redirect'?l.status>=300&&l.status<400:l.type.toLowerCase()===f))&&(!q||(l.source+l.target+l.anchor).toLowerCase().includes(q.toLowerCase())));
 return h(React.Fragment,null,h(Toolbar,{q,setQ,ph:'Search links…'},h('button',{className:'btn',onClick:()=>exp('links')},'Export CSV')),
  h(Chips,{opts:[['all','All'],['broken','Broken'],['redirect','Redirects'],['internal','Internal'],['external','External']],val:f,set:setF}),
  h(Tbl,{rows,cols:[{l:'Source page',r:l=>h('span',{className:'url'},l.source)},{l:'Target',r:l=>h('span',{className:'url'},l.target)},{l:'Anchor text',r:l=>l.anchor},{l:'Type',r:l=>l.type},{l:'Status',r:l=>stB(l.status)}]}));
}
function Images({images}){
 const [q,setQ]=useState(''),[f,setF]=useState('all');
 const rows=images.filter(i=>(f==='all'||(f==='alt'?!i.alt:i.kb>150))&&(!q||(i.page+i.src+i.alt).toLowerCase().includes(q.toLowerCase())));
 return h(React.Fragment,null,h(Toolbar,{q,setQ,ph:'Search images…'}),
  h(Chips,{opts:[['all','All'],['alt','Missing alt text'],['large','Large (>150 KB)']],val:f,set:setF}),
  h(Tbl,{rows,cols:[{l:'Image',r:i=>h('span',{className:'url'},i.src)},{l:'Found on',r:i=>h('span',{className:'url'},i.page)},{l:'Alt text',r:i=>i.alt?i.alt:h('span',{className:'b error'},'Missing')},{l:'Size',r:i=>h('span',{className:'b '+(i.kb>150?'warning':'ok')},i.kb+' KB')}]}));
}
function Exports({exp,n}){
 const items=[['pages','All pages','Every crawled URL with status, title, meta, H1, word count and response time.',n.p],['issues','Issues','Every detected technical SEO issue with severity and affected URL.',n.i],['links','Links','Internal and external links with source, target, anchor text and status.',n.l]];
 return d('ex',...items.map(([k,t,desc,c])=>h('div',{className:'card',key:k},h('h2',null,t),h('p',{className:'mut'},desc),h('div',{className:'mut'},c+' rows'),h('button',{className:'btn p',style:{padding:'9px 14px'},onClick:()=>exp(k)},'Export '+t+' CSV'))));
}

/* ---------- APP ---------- */
const NAV=[['dash','Dashboard','◧'],['pages','All Pages','▤'],['issues','Issues','⚠'],['links','Links','⛓'],['images','Images','▣'],['exports','Exports','⇩']];
function App(){
 const [view,setView]=useState('dash'),[url,setUrl]=useState('https://example-business.co.uk'),[dom,setDom]=useState('example-business.co.uk'),[st,setSt]=useState('idle'),[pr,setPr]=useState(0),[modal,setModal]=useState(null),[copied,setCopied]=useState(false);
 const [theme,setTheme]=useState(()=>{try{return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){return'light'}});
 useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);
 const tm=useRef();useEffect(()=>()=>clearInterval(tm.current),[]);
 const pages=useMemo(()=>build(dom),[dom]);
 const issues=useMemo(()=>pages.flatMap(p=>p.issues.map(i=>({...i,url:p.url}))),[pages]);
 const links=useMemo(()=>L.map(l=>({source:l[0],target:l[1],anchor:l[2],status:l[3],type:l[4]})),[]);
 const images=useMemo(()=>I.map(i=>({page:i[0],src:i[1],alt:i[2],kb:i[3]})),[]);
 const E=issues.filter(i=>i.sev==='error').length,W=issues.filter(i=>i.sev==='warning').length,B=links.filter(l=>l.status>=400).length;
 const score=Math.max(0,Math.round(100-E*2.2-W*0.9));
 function start(){
  const m=url.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  if(!m)return;setSt('run');setPr(0);let p=0;clearInterval(tm.current);
  tm.current=setInterval(()=>{p+=5;setPr(p);if(p>=100){clearInterval(tm.current);setDom(m);setSt('done')}},120);
 }
 function exp(k){
  const defs={pages:['pages',[['URL',r=>r.url],['Status',r=>r.status],['Title length',r=>r.title],['Meta description',r=>r.meta],['H1 count',r=>r.h1],['Word count',r=>r.words],['Response ms',r=>r.ms],['Severity',r=>r.sev],['Issues',r=>r.issues.map(i=>i.msg).join('; ')]],pages],issues:['issues',[['Severity',r=>r.sev],['Issue',r=>r.msg],['URL',r=>r.url]],issues],links:['links',[['Source',r=>r.source],['Target',r=>r.target],['Anchor',r=>r.anchor],['Type',r=>r.type],['Status',r=>r.status]],links]}[k];
  setCopied(false);setModal({name:'modernise-'+defs[0]+'-'+dom+'.csv',csv:csvOf(defs[1],defs[2])});
 }
 function dl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([modal.csv],{type:'text/csv'}));a.download=modal.name;a.click()}catch(e){}}
 function cp(){try{navigator.clipboard.writeText(modal.csv).then(()=>setCopied(true),()=>{})}catch(e){}}
 const T={dash:'Dashboard',pages:'All Pages',issues:'Issues',links:'Links',images:'Images',exports:'Exports'}[view];
 const cnt={pages:pages.length,issues:issues.length,links:links.length,images:images.length};
