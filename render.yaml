# Render Blueprint: one web service + one managed PostgreSQL database.
# In Render: New → Blueprint → connect this GitHub repo → Apply.
databases:
  - name: schoolverse-db
    databaseName: schoolverse
    user: schoolverse
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: schoolverse
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    # Applies pending migrations, then starts Next.js on Render's $PORT.
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: schoolverse-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # set to your public URL, e.g. https://schoolverse.onrender.com
      - key: SESSION_TTL_DAYS
        value: "14"
      - key: DEMO_ENABLED
        value: "true"
