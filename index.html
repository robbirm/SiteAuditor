<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modernise Site Auditor</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e6e8ec;--text:#0f172a;--mut:#64748b;--blue:#2563eb;--blue-s:#eff4ff;--red:#dc2626;--red-s:#fef2f2;--amb:#b45309;--amb-s:#fffbeb;--grn:#15803d;--grn-s:#f0fdf4;--hover:#f1f5f9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--panel:#12151c;--line:#232834;--text:#e8ecf3;--mut:#8b95a7;--blue:#5b8cff;--blue-s:#16213d;--red:#f87171;--red-s:#2a1517;--amb:#fbbf24;--amb-s:#2a2210;--grn:#4ade80;--grn-s:#10231a;--hover:#1a1f2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d12;--panel:#12151c;--line:#232834;--text:#e8ecf3;--mut:#8b95a7;--blue:#5b8cff;--blue-s:#16213d;--red:#f87171;--red-s:#2a1517;--amb:#fbbf24;--amb-s:#2a2210;--grn:#4ade80;--grn-s:#10231a;--hover:#1a1f2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:650;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.brand small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--mut);cursor:pointer;text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--hover);color:var(--text)}.nav.on{background:var(--blue-s);color:var(--blue)}
.nav .n{margin-left:auto;font-size:11px;background:var(--hover);color:var(--mut);border-radius:99px;padding:0 7px}
.sp{flex:1}
.main{flex:1;min-width:0;padding:24px 28px 40px;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:22px;letter-spacing:-.02em;margin:0}h2{font-size:15px;margin:0}
.mut{color:var(--mut)}
.banner{background:var(--amb-s);color:var(--amb);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.audit{display:flex;gap:10px;flex-wrap:wrap;padding:14px}
.audit input{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg);outline:none}
.audit input:focus,.q:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:550}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;padding:11px 22px;font-weight:600;box-shadow:0 1px 2px rgba(37,99,235,.35)}
.btn.p:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:default}
.bar{height:6px;background:var(--hover);border-radius:9px;overflow:hidden;margin-top:10px;width:100%}.bar i{display:block;height:100%;background:var(--blue);transition:width .15s}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.stat .l{color:var(--mut);font-size:12px;font-weight:500}.stat .v{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}.row .t{flex:1;min-width:0}.row .bar{margin:0;flex:1.2}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.q{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);outline:none}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-size:13px}
.chip.on{background:var(--blue-s);color:var(--blue);border-color:var(--blue)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:550;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--hover)}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:550;white-space:nowrap}
.b.error{background:var(--red-s);color:var(--red)}.b.warning{background:var(--amb-s);color:var(--amb)}.b.ok{background:var(--grn-s);color:var(--grn)}.b.notice{background:var(--blue-s);color:var(--blue)}
.empty{padding:36px;text-align:center;color:var(--mut)}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ex .card{display:flex;flex-direction:column;gap:8px}.ex p{margin:0;flex:1}
.mask{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;padding:16px;z-index:9}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(720px,100%);max-height:85vh;display:flex;flex-direction:column;gap:10px}
.modal textarea{flex:1;min-height:220px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px;font:12px ui-monospace,Menlo,monospace;resize:vertical}
@media (max-width:820px){
.app{flex-direction:column}
.side{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;border-right:0;border-bottom:1px solid var(--line);align-items:center}
.brand{padding:0 8px 0 4px}.brand small,.nav .n,.sp{display:none}.nav{width:auto;white-space:nowrap}
.main{padding:16px 14px 32px}.grid2{grid-template-columns:1fr}.stat .v{font-size:24px}}
a.btn{text-decoration:none;color:inherit;display:inline-block}a.btn.p{color:#fff}
.audit input.lim{flex:none;width:110px;min-width:0}
.banner.err{background:var(--red-s);color:var(--red)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.q.sel{flex:none;min-width:0;width:auto;max-width:100%}
.kvr{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.kk{width:130px;flex:none;color:var(--mut);font-size:12px}.kvv{min-width:0;word-break:break-word;flex:1}
summary{cursor:pointer;color:var(--blue);font-weight:550;margin-top:8px}
@media (max-width:820px){.kvr{flex-direction:column;gap:2px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect}=React;
const h=React.createElement;
const d=(c,...k)=>{const p={className:c};if(k[0]&&typeof k[0]==='object'&&!k[0].$$typeof&&!Array.isArray(k[0]))Object.assign(p,k.shift());return h('div',p,...k)};

/* ---------- helpers ---------- */
const SC={critical:'error',warning:'warning',info:'notice',ok:'ok'},SL={critical:'Critical',warning:'Warning',info:'Info',ok:'OK'};
const PAGE=50,ACTIVE=['queued','running','cancelling'];
const STATUS_LABEL={queued:'Queued',running:'Crawling',cancelling:'Cancelling',done:'Completed',cancelled:'Cancelled (partial results)',error:'Failed'};
const sevB=s=>h('span',{className:'b '+SC[s]},SL[s]||s);
const short=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const num=n=>n==null?'—':Number(n).toLocaleString();
const mono=u=>h('span',{className:'url'},u);
const dim=t=>h('span',{className:'mut'},t||'—');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const statusB=p=>p.blocked?h('span',{className:'b notice'},'Blocked'):p.failed?h('span',{className:'b error'},'Failed'):h('span',{className:'b '+(p.status>=400?'error':p.status>=300?'notice':'ok')},p.status);
const linkB=l=>h('span',{className:'b '+(l.broken?'error':l.redirect?'notice':l.status?'ok':'notice')},l.statusText);
const altB=i=>h('span',{className:'b '+({Missing:'warning',Empty:'notice',Present:'ok'})[i.altStatus]},i.altStatus);

async function api(path,opts){
  let res;
  try{res=await fetch(path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts&&opts.headers)}})}
  catch(e){throw new Error('Cannot reach the backend. Is the Node.js server running?')}
  let data=null;try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error((data&&data.error)||('Request failed ('+res.status+')'));
  return data;
}
function useDebounced(v,ms){const [x,setX]=useState(v);useEffect(()=>{const t=setTimeout(()=>setX(v),ms);return()=>clearTimeout(t)},[v,ms]);return x}
function useList(section,crawlId,params,tick){
  const [s,setS]=useState({rows:[],total:0,loading:false,err:''});
  const key=JSON.stringify(params);
  useEffect(()=>{
    if(!crawlId){setS({rows:[],total:0,loading:false,err:''});return}
    let dead=false;setS(x=>({...x,loading:true}));
    api('/api/crawls/'+crawlId+'/'+section+'?'+new URLSearchParams(params))
      .then(r=>{if(!dead)setS({rows:r.rows,total:r.total,loading:false,err:''})})
      .catch(e=>{if(!dead)setS(x=>({...x,loading:false,err:e.message}))});
    return()=>{dead=true};
  },[crawlId,section,key,tick]);
  return s;
}

/* ---------- shared components ---------- */
function Tbl({cols,rows,onRow,sort,setSort}){
  if(!rows.length)return d('tw',d('empty','No results.'));
  const arrow=c=>sort&&c.sk&&sort.k===c.sk?(sort.d==='asc'?' ↑':' ↓'):'';
  return d('tw',h('table',null,
    h('thead',null,h('tr',null,...cols.map((c,i)=>h('th',{key:i,className:c.sk?'s':'',onClick:c.sk&&setSort?()=>setSort(s=>({k:c.sk,d:s.k===c.sk&&s.d==='asc'?'desc':'asc'})):undefined},c.l+arrow(c))))),
    h('tbody',null,...rows.map((r,i)=>h('tr',{key:i,style:onRow?{cursor:'pointer'}:null,onClick:onRow?()=>onRow(r):undefined},...cols.map((c,j)=>h('td',{key:j},c.r(r))))))));
}
function Pager({off,total,set}){
  if(total<=PAGE)return null;
  return d('tools',{style:{justifyContent:'space-between',marginTop:10}},
    h('span',{className:'mut'},num(off+1)+'–'+num(Math.min(off+PAGE,total))+' of '+num(total)),
    d('tools',h('button',{className:'btn',disabled:off===0,onClick:()=>set(Math.max(0,off-PAGE))},'← Prev'),h('button',{className:'btn',disabled:off+PAGE>=total,onClick:()=>set(off+PAGE)},'Next →')));
}
function ExportBtn({crawlId,file,label,primary}){
  const cls='btn'+(primary?' p':'');
  return crawlId?h('a',{className:cls,href:'/api/crawls/'+crawlId+'/export/'+file+'.csv',download:''},label):h('button',{className:cls,disabled:true},label);
}

// One searchable / filterable / paginated table backed by /api/crawls/:id/<section>
function ListPage({section,crawlId,tick,ph,filters,cols,btns,onRow,init,sortable}){
  const [q,setQ]=useState(''),dq=useDebounced(q,300);
  const [fv,setFv]=useState(()=>{const o={};filters.forEach(f=>{o[f.name]=(init&&init[f.name])||'all'});return o});
  const [off,setOff]=useState(0),[sort,setSort]=useState({k:'',d:'asc'});
  const fk=JSON.stringify(fv);
  useEffect(()=>{setOff(0)},[dq,fk,sort.k,sort.d]);
  const params={offset:off,limit:PAGE};
  if(dq)params.q=dq;
  Object.entries(fv).forEach(([k,v])=>{if(v!=='all')params[k]=v});
  if(sort.k){params.sort=sort.k;params.dir=sort.d}
  const s=useList(section,crawlId,params,tick);
  if(!crawlId)return d('card empty','Start an audit to see real results here.');
  const setF=(n,v)=>setFv(x=>({...x,[n]:v}));
  return h(React.Fragment,null,
    d('tools',h('input',{className:'q',placeholder:ph,value:q,onChange:e=>setQ(e.target.value)}),...btns),
    ...filters.map(f=>f.type==='select'
      ?d('tools',{key:f.name},h('select',{className:'q sel',value:fv[f.name],onChange:e=>setF(f.name,e.target.value)},h('option',{value:'all'},f.all),...f.opts.map(([v,l])=>h('option',{key:v,value:v},l))))
      :d('tools',{key:f.name},...f.opts.map(([v,l])=>h('button',{key:v,className:'chip'+(fv[f.name]===v?' on':''),onClick:()=>setF(f.name,v)},l)))),
    s.err?d('banner err',s.err):d('mut',{style:{marginBottom:8}},s.loading&&!s.rows.length?'Loading…':num(s.total)+' results'),
    h(Tbl,{cols,rows:s.rows,onRow,sort:sortable?sort:null,setSort:sortable?setSort:null}),
    h(Pager,{off,total:s.total,set:setOff}));
}

function Detail({p,onClose}){
  const kv=(k,v)=>d('kvr',{key:k},d('kk',k),d('kvv',v||dim()));
  const robots=[p.metaRobots&&'meta: '+p.metaRobots,p.xRobots&&'header: '+p.xRobots].filter(Boolean).join(' · ');
  return d('mask',{onClick:onClose},h('div',{className:'modal',onClick:e=>e.stopPropagation()},
    h('h2',null,'Page details'),
    d('',{style:{overflow:'auto',minHeight:0}},
      kv('URL',mono(p.url)),kv('Status',statusB(p)),
      kv('Title',p.title?p.title+'  ('+p.title.length+' chars)':null),
      kv('Meta description',p.metaDescription?p.metaDescription+'  ('+p.metaDescription.length+' chars)':null),
      kv('H1 headings',p.h1.length?p.h1.join(' | '):null),
      kv('Canonical',p.canonical?mono(p.canonical):null),
      kv('Robots directives',robots||null),
      kv('Redirect',p.redirectTo?[p.url].concat(p.redirectChain).join(' → '):null),
      kv('Response time',p.responseMs===''?null:p.responseMs+' ms'),
      kv('Internal links in',String(p.inlinks)),
      kv('Discovered from',p.discoveredFrom?mono(p.discoveredFrom):null),
      kv('Notes',p.note||null),
      h('h2',{style:{margin:'16px 0 6px'}},'Issues ('+p.issues.length+')'),
      ...(p.issues.length?p.issues.map((i,n)=>d('kvr',{key:'i'+n},d('kk',sevB(i.severity)),d('kvv',h('b',null,i.label),i.detail?d('mut',i.detail):null,d('mut','Fix: '+i.fix)))):[d('mut','No issues found on this page.')])),
    d('tools',h('button',{className:'btn',onClick:onClose},'Close'))));
}

/* ---------- views ---------- */
function Dashboard({pr,crawlId,tick,go,onRow}){
  const attn=useList('pages',crawlId,{severity:'critical',limit:6},tick);
  if(!pr)return d('card empty','No audit yet. Enter your website address above and press Start Audit. Real results appear here as the crawl progresses.');
  const s=pr.summary,W=s.scoreModel.weights;
  const sevCard=(sev,title)=>{
    const ts=s.issueTypes.filter(t=>t.severity===sev);
    return d('card',{key:sev},h('h2',null,title+' · '+num(s.counts[sev])),
      ...(ts.length?ts.map(t=>d('row',{key:t.type,style:{cursor:'pointer'},onClick:()=>go('issues',{severity:sev,type:t.type})},d('t',t.label),h('b',null,num(t.count)))):[d('mut',{style:{marginTop:8}},'None found')]));
  };
  return h(React.Fragment,null,
    ...pr.notes.map((n,i)=>d('banner',{key:'n'+i},n)),
    pr.message?d('banner err',pr.message):null,
    d('grid3',sevCard('critical','Critical'),sevCard('warning','Warnings'),sevCard('info','Information')),
    d('grid2',
      d('card',h('h2',null,'Technical SEO health score'),
        d('row',h('b',{style:{fontSize:34,letterSpacing:'-.02em'}},s.score==null?'—':s.score+' / 100'),d('t mut','Average page score across '+num(s.crawled)+' crawled pages')),
        h('details',null,h('summary',null,'How is this calculated?'),h('p',{className:'mut'},s.scoreModel.text),
          h('p',{className:'mut'},'Weights: Critical −'+W.critical+', Warning −'+W.warning+', Info −'+W.info+' (per distinct issue type, per page).'))),
      d('card',h('h2',null,'Pages needing attention'),
        ...(attn.rows.length?attn.rows.map(p=>d('row',{key:p.url,style:{cursor:'pointer'},onClick:()=>onRow(p)},h('span',{className:'url t'},short(p.url.replace(/^https?:\/\//,''),64)),sevB(p.severity))):[d('mut',{style:{marginTop:8}},attn.loading?'Loading…':'No critical pages found.')]),
        h('button',{className:'btn',style:{marginTop:10},onClick:()=>go('pages',{severity:'critical'})},'View all →'))));
}

function Exports({crawlId,s}){
  const t=s&&s.totals;
  const items=[
    ['pages','All Pages','Every crawled URL with status, title, description, headings, canonical, response time and SEO data.',t&&t.pages],
    ['issues','All Issues','Every issue with severity, affected URL and a suggested fix.',t&&t.issues],
    ['links','All Links','Every link found: source, destination, anchor text and status.',t&&t.links],
    ['broken-links','Broken Links','Source pages and their broken internal destinations.',t&&t.brokenLinks],
    ['images','Images','Every image with its source page and ALT attribute status.',t&&t.images]];
  return d('ex',...items.map(([f,title,desc,n])=>h('div',{className:'card',key:f},h('h2',null,title),h('p',{className:'mut'},desc),d('mut',crawlId?num(n)+' rows (all rows are exported)':'Run an audit first'),h(ExportBtn,{crawlId,file:f,label:'Export '+title+' CSV',primary:true}))));
}

const PAGES_COLS=[
  {l:'URL',sk:'url',r:p=>mono(p.url)},{l:'Status',sk:'status',r:statusB},
  {l:'Title',sk:'title',r:p=>p.parsed?(p.title?short(p.title,60):dim()):dim()},
  {l:'Meta desc',r:p=>p.parsed?(p.metaDescription?'Yes':'No'):dim()},{l:'H1',r:p=>p.parsed?p.h1Count:dim()},
  {l:'Canonical',r:p=>({self:'Self',other:'Other',none:'None'})[p.canonicalStatus]||dim()},
  {l:'Response',sk:'responseMs',r:p=>p.responseMs===''?dim():p.responseMs+' ms'},
  {l:'Issues',sk:'severity',r:p=>p.issues.length?h(React.Fragment,null,sevB(p.severity),' '+p.issues.length):sevB('ok')}];
const ISSUE_COLS=[{l:'Severity',r:i=>sevB(i.severity)},{l:'Issue',r:i=>i.label},{l:'Affected URL',r:i=>mono(i.url)},{l:'Detail',r:i=>i.detail?short(i.detail,140):dim()},{l:'Suggested fix',r:i=>i.fix}];
const LINK_COLS=[{l:'Source page',r:l=>mono(l.source)},{l:'Destination',r:l=>mono(l.destination)},{l:'Anchor text',r:l=>l.anchor||dim()},{l:'Type',r:l=>l.type},{l:'Status',r:linkB}];
const IMAGE_COLS=[{l:'Image',r:i=>mono(i.src)},{l:'Source page',r:i=>mono(i.page)},{l:'ALT status',r:altB},{l:'ALT text',r:i=>i.alt?short(i.alt,80):dim()}];

/* ---------- app ---------- */
const NAV=[['dash','Dashboard','◧'],['pages','All Pages','▤'],['issues','Issues','⚠'],['links','Links','⛓'],['images','Images','▣'],['exports','Exports','⇩']];
function App(){
  const [view,setView]=useState('dash'),[init,setInit]=useState(null),[url,setUrl]=useState(''),[limit,setLimit]=useState(500),[max,setMax]=useState(1000);
  const [backend,setBackend]=useState('checking'),[crawlId,setCrawlId]=useState(null),[pr,setPr]=useState(null),[err,setErr]=useState(''),[detail,setDetail]=useState(null);
  const [theme,setTheme]=useState(()=>{try{return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){return'light'}});
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);

  useEffect(()=>{ // detect the backend and resume the last crawl (results are kept on the server for a while)
    let dead=false;
    api('/api/status').then(async st=>{
      if(dead)return;setBackend('ok');setLimit(st.defaultLimit);setMax(st.maxLimit);
      const id=lsGet('msa_crawl');
      if(id){try{const p=await api('/api/crawls/'+id);if(!dead){setCrawlId(id);setPr(p);setUrl(p.startUrl);setLimit(p.limit)}}catch(e){lsSet('msa_crawl',null)}}
    }).catch(()=>{if(!dead)setBackend('down')});
    return()=>{dead=true};
  },[]);

  const status=pr&&pr.status,active=!!status&&ACTIVE.includes(status);
  useEffect(()=>{ // real progress: poll the backend while a crawl is running
    if(!crawlId||!active)return;
    let dead=false;
    const t=setInterval(async()=>{try{const p=await api('/api/crawls/'+crawlId);if(!dead)setPr(p)}catch(e){if(!dead)setErr(e.message)}},1000);
    return()=>{dead=true;clearInterval(t)};
  },[crawlId,active]);

  const go=(v,i)=>{setView(v);setInit(i||null)};
  async function start(){
    setErr('');
    try{const p=await api('/api/crawls',{method:'POST',body:JSON.stringify({url:url.trim(),limit:Number(limit)||undefined})});setCrawlId(p.id);setPr(p);lsSet('msa_crawl',p.id);go('dash')}
    catch(e){setErr(e.message)}
  }
  async function cancel(){try{setPr(await api('/api/crawls/'+crawlId+'/cancel',{method:'POST'}))}catch(e){setErr(e.message)}}

  const s=pr&&pr.summary,tick=pr?pr.pagesCrawled+':'+pr.status+':'+s.totals.pages:'';
  const stat=(l,v,c)=>d('card stat',d('l',l),d('v',{style:c?{color:c}:null},v));
  const scoreColor=!s||s.score==null?null:s.score>=80?'var(--grn)':s.score>=60?'var(--amb)':'var(--red)';
  const T=({dash:'Dashboard',pages:'All Pages',issues:'Issues',links:'Links',images:'Images',exports:'Exports'})[view];
  const cnt=s?{pages:s.totals.pages,issues:s.totals.issues,links:s.totals.links,images:s.totals.images}:{};
  const vk=view+JSON.stringify(init);
  const common={crawlId,tick,onRow:setDetail,init};
  return d('app',
    h('aside',{className:'side'},d('brand',d('logo','M'),d('',null,'Site Auditor',h('small',null,'Modernise My Business'))),
      ...NAV.map(([k,l,ic])=>h('button',{key:k,className:'nav'+(view===k?' on':''),onClick:()=>go(k)},h('span',null,ic),l,cnt[k]!=null?h('span',{className:'n'},num(cnt[k])):null)),
      d('sp'),h('button',{className:'nav',onClick:()=>setTheme(theme==='dark'?'light':'dark')},h('span',null,theme==='dark'?'☀':'☾'),theme==='dark'?'Light mode':'Dark mode')),
    h('main',{className:'main'},
      d('top',h('div',null,h('h1',null,T),d('mut',pr?pr.startUrl+' · '+(STATUS_LABEL[pr.status]||pr.status):'No audit run yet'))),
      backend==='down'?d('banner err','Backend not connected. Start the Node.js server (npm run dev) and open this page from it. No sample data is shown.'):null,
      err?d('banner err',err):null,
      d('card audit',
        h('input',{value:url,onChange:e=>setUrl(e.target.value),onKeyDown:e=>{if(e.key==='Enter'&&!active&&backend==='ok'&&url.trim())start()},placeholder:'https://yourwebsite.com','aria-label':'Website URL'}),
        h('input',{className:'lim',type:'number',min:1,max:max,value:limit,onChange:e=>setLimit(e.target.value),title:'Page limit (max '+max+')','aria-label':'Page limit'}),
        active?h('button',{className:'btn',onClick:cancel,disabled:status==='cancelling'},status==='cancelling'?'Cancelling…':'Cancel'):null,
        h('button',{className:'btn p',disabled:active||backend!=='ok'||!url.trim(),onClick:start},active?'Auditing… '+pr.percent+'%':'Start Audit'),
        active?d('bar',h('i',{style:{width:pr.percent+'%'}})):null,
        active?d('mut',{style:{width:'100%'}},'Crawled '+num(pr.pagesCrawled)+' pages · '+num(pr.discovered)+' URLs discovered · '+num(pr.queued)+' queued · limit '+num(pr.limit)):null),
      d('cards',stat('Pages crawled',pr?num(pr.pagesCrawled):'—'),stat('Critical',s?num(s.counts.critical):'—','var(--red)'),stat('Warnings',s?num(s.counts.warning):'—','var(--amb)'),stat('Broken links',s?num(s.totals.brokenLinks):'—','var(--red)'),stat('Health score',s&&s.score!=null?s.score+'/100':'—',scoreColor)),
      view==='dash'&&h(Dashboard,{pr,crawlId,tick,go,onRow:setDetail}),
      view==='pages'&&h(ListPage,{...common,key:vk,section:'pages',ph:'Search URLs, titles, descriptions, headings…',sortable:true,cols:PAGES_COLS,
        btns:[h(ExportBtn,{key:'e',crawlId,file:'pages',label:'Export All Pages CSV'})],
        filters:[{name:'status',type:'chips',opts:[['all','All'],['2xx','2xx OK'],['3xx','3xx Redirects'],['4xx','4xx Errors'],['5xx','5xx Errors'],['issues','With issues']]},{name:'severity',type:'chips',opts:[['all','Any severity'],['critical','Critical'],['warning','Warning'],['info','Info']]}]}),
      view==='issues'&&h(ListPage,{...common,key:vk,section:'issues',ph:'Search issues or URLs…',cols:ISSUE_COLS,onRow:null,
        btns:[h(ExportBtn,{key:'e',crawlId,file:'issues',label:'Export All Issues CSV'})],
        filters:[{name:'severity',type:'chips',opts:[['all','All'],['critical','Critical'],['warning','Warnings'],['info','Information']]},{name:'type',type:'select',all:'All issue types',opts:s?s.issueTypes.map(t=>[t.type,t.label+' ('+t.count+')']):[]}]}),
      view==='links'&&h(ListPage,{...common,key:vk,section:'links',ph:'Search source, destination or anchor text…',cols:LINK_COLS,onRow:null,
        btns:[h(ExportBtn,{key:'e',crawlId,file:'links',label:'Export All Links CSV'}),h(ExportBtn,{key:'b',crawlId,file:'broken-links',label:'Export Broken Links CSV'})],
        filters:[{name:'filter',type:'chips',opts:[['all','All'],['broken','Broken'],['redirect','Redirects'],['internal','Internal'],['external','External']]}]}),
      view==='images'&&h(ListPage,{...common,key:vk,section:'images',ph:'Search image URL, page or ALT text…',cols:IMAGE_COLS,onRow:null,
        btns:[h(ExportBtn,{key:'e',crawlId,file:'images',label:'Export Images CSV'})],
        filters:[{name:'filter',type:'chips',opts:[['all','All'],['missing','Missing ALT'],['empty','Empty ALT'],['present','Has ALT']]}]}),
      view==='exports'&&h(Exports,{crawlId,s})),
    detail?h(Detail,{p:detail,onClose:()=>setDetail(null)}):null);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
